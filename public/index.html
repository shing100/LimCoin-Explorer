<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!--
      주소창·상태바 색. 테마마다 다르므로 둘 다 적는다.
      예전에는 #000000 하나였는데 라이트에도 다크에도 없는 색이었다.
    -->
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">

    <title>LimCoin 익스플로러</title>
    <meta name="description" content="LimCoin 블록체인 익스플로러. 블록, 트랜잭션, 주소를 찾아보고 네트워크 상태와 수수료를 확인합니다.">

    <!--
      링크 미리보기(OG).

      익스플로러의 주된 쓰임이 링크를 뿌리는 것이다 — "이 트랜잭션 봐라",
      거래소에 입금 증빙. 그런데 미리보기가 빈칸이면 그 쓰임이 반쯤 죽는다.

      여기 적은 것은 **기본값**이다. 블록이나 트랜잭션마다 다른 미리보기는
      server/ 의 작은 서버가 내려 주기 직전에 이 태그들을 갈아 끼워 만든다
      (`npm run serve`). 태그 이름이나 모양을 여기서 바꾸면 server/index.js
      의 치환 규칙도 같이 고쳐야 한다 — 안 고치면 서버가 경고를 찍는다.

      정적 파일만 올리는 곳(S3, GitHub Pages)에 배포하면 그 서버가 없으므로
      링크 미리보기 봇은 이 기본값만 본다. 브라우저 탭 제목과 북마크는 어느
      쪽이든 화면마다 바뀐다(src/meta.js).
    -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="LimCoin 익스플로러">
    <meta property="og:title" content="LimCoin 익스플로러">
    <meta property="og:description" content="LimCoin 블록체인 익스플로러. 블록, 트랜잭션, 주소를 찾아보고 네트워크 상태와 수수료를 확인합니다.">
    <meta property="og:image" content="%PUBLIC_URL%/icon-512.png">
    <meta property="og:locale" content="ko_KR">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="LimCoin 익스플로러">
    <meta name="twitter:description" content="LimCoin 블록체인 익스플로러. 블록, 트랜잭션, 주소를 찾아봅니다.">
    <meta name="twitter:image" content="%PUBLIC_URL%/icon-512.png">

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json">
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any">
    <link rel="icon" href="%PUBLIC_URL%/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png">

    <!--
      Pretendard — 리포에 함께 둔다(SIL OFL 1.1, public/fonts/pretendard/LICENSE.txt).
      CDN 을 쓰지 않는 이유는 예전과 같다: 로컬 노드를 보는 도구가 바깥 네트워크에
      매달릴 이유가 없고, 지갑은 아예 오프라인에서도 떠야 한다.

      동적 서브셋판이라 파일이 92개지만 브라우저는 화면에 실제로 쓰인 글자가
      든 조각만 내려받는다(unicode-range). 전부 받는 판(2MB)을 쓰면 첫 화면이
      그만큼 늦어진다.
    -->
    <link rel="stylesheet" href="%PUBLIC_URL%/fonts/pretendard/pretendard.css">

    <!--
      고른 밝기를 첫 칠 이전에 붙인다.

      React 가 뜬 뒤에 붙이면, OS 가 라이트인 사람이 다크를 골라 둔 경우
      흰 화면이 한 번 번쩍이고 나서 어두워진다. 이 스크립트가 <head> 안의
      동기 스크립트여야 하는 이유다 — 여기서 멈춰 실행된 뒤에 <body> 가
      그려진다. 실제 색 규칙은 CSS(globalStyles.js)에 있고 여기서는
      속성만 얹는다.
    -->
    <script>
      (function () {
        try {
          var mode = window.localStorage.getItem("limcoin.theme");
          if (mode === "light" || mode === "dark") {
            document.documentElement.setAttribute("data-theme", mode);
          }
        } catch (e) {
          /* 저장소가 막혀 있으면 OS 설정을 따른다 */
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      이 익스플로러는 자바스크립트로 동작합니다. 브라우저에서 자바스크립트를 켜 주세요.
      노드에 직접 물어보려면 REST API(<code>/blocks</code>, <code>/transactions/:id</code>)나
      JSON-RPC(<code>POST /rpc</code>)를 쓰면 됩니다.
    </noscript>
    <div id="root"></div>
  </body>
</html>
